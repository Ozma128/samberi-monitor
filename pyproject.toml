[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".pytest-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The bot can also be started as a file, so it bootstraps the repository root
# before importing the shared `core` package.
"deploy/telegram_bot.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
